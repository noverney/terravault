name: CDSE S3 fetch - Zurich L1C

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cdse-s3-fetch.yml
      - scripts/ci/fetch_l1c_smoke.py
      - terravault/l1c_download.py
      - terravault/s3_downloader.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cdse-s3-fetch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TERRAVAULT_CDSE_S3_ACCESS_KEY: ${{ secrets.TERRAVAULT_CDSE_S3_ACCESS_KEY }}
      TERRAVAULT_CDSE_S3_SECRET_KEY: ${{ secrets.TERRAVAULT_CDSE_S3_SECRET_KEY }}
      TERRAVAULT_CDSE_S3_ENDPOINT: https://eodata.dataspace.copernicus.eu
      TERRAVAULT_CDSE_S3_REGION: default
      TEST_ITEM_ID: S2B_MSIL1C_20260717T103029_N0512_R108_T32TMT_20260717T140459
    steps:
      - name: Check out TerraVault
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify required secrets are available
        shell: bash
        run: |
          test -n "$TERRAVAULT_CDSE_S3_ACCESS_KEY" || {
            echo "Missing TERRAVAULT_CDSE_S3_ACCESS_KEY" >&2
            exit 1
          }
          test -n "$TERRAVAULT_CDSE_S3_SECRET_KEY" || {
            echo "Missing TERRAVAULT_CDSE_S3_SECRET_KEY" >&2
            exit 1
          }

      - name: Install S3 download dependencies
        run: python -m pip install -e ".[s3]"

      - name: Fetch and validate complete Zurich L1C SAFE
        run: >-
          python scripts/ci/fetch_l1c_smoke.py
          --item-id "$TEST_ITEM_ID"
          --output-root "$RUNNER_TEMP/terravault-cdse-fetch"

      - name: Confirm no persisted workflow artifacts
        run: |
          test -f "$RUNNER_TEMP/terravault-cdse-fetch/fetch-result.json"
          python -m json.tool \
            "$RUNNER_TEMP/terravault-cdse-fetch/fetch-result.json"
