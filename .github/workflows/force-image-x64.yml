name: FORCE image - x64 Linux

on:
  pull_request:
    paths:
      - .github/workflows/force-image-x64.yml
      - docker/force.Dockerfile
      - vendor/force
  push:
    branches: [main]
    paths:
      - .github/workflows/force-image-x64.yml
      - docker/force.Dockerfile
      - vendor/force
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: force-image-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMAGE: terravault/force:3.10.04-amd64-ci
    steps:
      - name: Check out TerraVault and pinned FORCE
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build native linux/amd64 image
        run: >-
          docker build
          --platform linux/amd64
          --file docker/force.Dockerfile
          --tag "$IMAGE"
          .

      - name: Verify architecture and FORCE commands
        run: |
          test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE")" = amd64
          docker run --rm --platform linux/amd64 "$IMAGE" sh -eu -c '
            test "$(uname -m)" = x86_64
            force-info | grep -F "FORCE v. 3.10.04"
            command -v force-level2
            command -v force-l2ps
            command -v force-cube-init
            command -v force-cube
            command -v force-mosaic
            ! grep -q -- "--eta" "$(command -v force-level2)"
          '
