[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terravault"
version = "0.1.0"
description = "Satellite data ingestion pipeline – STAC-based discovery and download for open satellite imagery"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["satellite", "stac", "sentinel", "remote-sensing", "geospatial"]
dependencies = [
    "pystac-client>=0.8",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
raster = ["rasterio>=1.3"]
postgres = ["psycopg2-binary>=2.9"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "responses>=0.25",
]

[project.scripts]
terravault = "terravault.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["terravault*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
